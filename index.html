<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite Trombetas e Festas 2026</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px 14px 40px;background:#f1f4f6;color:#17212b;font-family:Arial,sans-serif}main{max-width:980px;margin:auto}h1{text-align:center;font-size:clamp(22px,4vw,32px)}.intro{text-align:center;color:#53616b}.layout{display:grid;grid-template-columns:minmax(260px,.78fr) minmax(320px,1.22fr);gap:22px;align-items:start}.panel{background:white;border-radius:14px;padding:20px}label{display:block;font-weight:bold;margin:0 0 7px}input{width:100%;padding:12px;margin:0 0 16px;border:1px solid #b9c5ce;border-radius:8px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#08688a;color:white;font-size:16px;font-weight:bold;cursor:pointer}.note{font-size:13px;line-height:1.5;color:#66737d}.preview{width:100%;height:auto;display:block;border-radius:8px}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head><body><main><h1>Convite – Trombetas e Festas 2026</h1><p class="intro">Personalize os campos da igreja e gere o convite para compartilhar.</p><div class="layout"><section class="panel"><label for="church">Nome da Igreja Cristã Maranata</label><input id="church" maxlength="65" placeholder="Digite o nome da igreja"><label for="address">Endereço</label><input id="address" maxlength="110" placeholder="Digite o endereço da igreja"><button id="download">Baixar convite em PNG</button><p class="note">Arte superior substituída pela imagem enviada. Data e horário: 28 de novembro de 2026, às 17h (BRT). Nome da igreja e endereço permanecem editáveis.</p></section><section><canvas id="canvas" class="preview"></canvas></section></div></main><script>
const art=new Image();art.src="arte-superior-2026.jpg";const c=document.getElementById("canvas"),x=c.getContext("2d"),church=document.getElementById("church"),address=document.getElementById("address");
function wrap(t,a,b,m,l,f){x.font=f;let s="";for(const q of t.split(/\s+/)){let z=s?s+" "+q:q;if(x.measureText(z).width>m&&s){x.fillText(s,a,b);s=q;b+=l}else s=z}if(s)x.fillText(s,a,b)}
function draw(){if(!art.complete||!art.naturalWidth)return;let w=1000,hh=Math.round(w*art.height/art.width),h=hh+535;c.width=w;c.height=h;x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(art,0,0,w,hh);let y=hh+42;x.fillStyle="#111";x.textAlign="center";x.font="bold 34px Arial";x.fillText("CONVITE ESPECIAL",w/2,y);x.textAlign="left";let t="A Igreja Cristã Maranata tem a honra de convidar você e seus familiares para participar do “Culto Trombetas e Festas 2026”. Será um evento de alerta para o mundo sobre os acontecimentos atuais que antecedem a volta de Jesus. O evento será transmitido às 17h (BRT) do dia 28 de Novembro de 2026, em todas as nossas igrejas. Sendo assim, convidamos você e sua família para assistirem ao evento na:";wrap(t,58,y+58,w-116,29,"bold 22px Arial");let fy=y+260;x.font="bold 22px Arial";x.fillText("Igreja Cristã Maranata:",58,fy);x.fillText("No Endereço:",58,fy+43);x.font="22px Arial";x.fillText(church.value.trim(),330,fy,600);x.fillText(address.value.trim(),205,fy+43,725);x.strokeStyle="#222";x.lineWidth=2;x.beginPath();x.moveTo(325,fy+7);x.lineTo(940,fy+7);x.moveTo(180,fy+50);x.lineTo(940,fy+50);x.stroke()}
art.onload=draw;church.addEventListener("input",draw);address.addEventListener("input",draw);document.getElementById("download").onclick=()=>{draw();let a=document.createElement("a");a.download="convite-trombetas-e-festas-2026.png";a.href=c.toDataURL("image/png");a.click()};
</script></body></html>
